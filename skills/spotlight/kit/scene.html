<!doctype html>
<!-- spotlight scene template: copy to work/ with kit.js, write work/timeline.js, then fill the captions and end card.
     Set lang/dir on <html> (or on each caption) for the video's language. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  /* brand tokens: from the brief, the logo or the footage */
  :root {
    --ink: #111827; --paper: #FAF7F0; --accent: #E4B53B; --text: #ffffff; --muted: #4B5563;
    --display: 'Space Grotesk', sans-serif; --body: 'Inter', sans-serif;
  }
  /* --W --H --k --safe-top --safe-bottom --side come from kit.js */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--ink); }
  #stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; }
  #foot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #panel { position: absolute; object-fit: cover; opacity: 0; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  #web { position: absolute; left: 0; top: 0; width: 100%; height: auto; opacity: 0; }
  canvas.three { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  /* placed by a three shot's anchors: centred on the point; .label is a name tag sitting just above it */
  [data-anchor] { position: absolute; left: 0; top: 0; opacity: 0; transform: translate(-50%, -50%); pointer-events: none; }
  [data-anchor].label { transform: translate(-50%, calc(-100% - 18px * var(--k))); white-space: nowrap;
    font: 600 calc(34px * var(--k))/1.2 var(--body); color: var(--text); padding: calc(8px * var(--k)) calc(16px * var(--k));
    background: color-mix(in srgb, var(--ink) 72%, transparent); border-radius: calc(10px * var(--k)); }
  #grain { position: absolute; inset: 0; opacity: 0; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.28) 100%); }
  #dip { position: absolute; inset: 0; opacity: 0; background: #000; pointer-events: none; }
  .scrim { position: absolute; left: 0; right: 0; opacity: 0; pointer-events: none; }
  #scrim-top { top: 0; height: 45%; background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,.4) 50%, rgba(0,0,0,0)); }
  #scrim-bottom { bottom: 0; height: 52%; background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.42) 45%, rgba(0,0,0,0)); }

  /* captions: .low grows upward from the bottom safe line, so long text never reaches platform UI */
  .cap { position: absolute; left: var(--side); right: var(--side); opacity: 0; }
  .cap.low { bottom: var(--safe-bottom); }
  .cap.high { top: var(--safe-top); }
  .cap.mid { top: 50%; transform: translateY(-50%); }
  .cap.left { right: 52%; } .cap.right { left: 52%; }  /* landscape: one half for the caption, the other for the evidence */
  .rule { width: 0; height: calc(4px * var(--k)); background: var(--accent); margin-bottom: calc(26px * var(--k)); }
  [dir=rtl] .rule { margin-left: auto; }
  .kicker { font: 600 calc(36px * var(--k))/1.25 var(--body); letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: calc(18px * var(--k)); }
  /* letter-spacing pulls joined letters apart: never on Arabic-script text */
  :is([lang=fa], [lang=ar], [lang=ur]) .kicker, .kicker:is([lang=fa], [lang=ar], [lang=ur]) { letter-spacing: 0; }
  .line { font: 600 calc(80px * var(--k))/1.12 var(--display); letter-spacing: -.01em; color: var(--text); }
  :is([lang=fa], [lang=ar], [lang=ur]) .line { letter-spacing: 0; line-height: 1.35; }
  .ln { display: block; }
  .sub { font: 500 calc(40px * var(--k))/1.35 var(--body); color: rgba(255,255,255,.92); margin-top: calc(22px * var(--k)); }
  .row { display: flex; align-items: baseline; gap: calc(34px * var(--k)); padding: calc(22px * var(--k)) 0;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .row .n { font: 600 calc(34px * var(--k))/1 var(--body); color: var(--accent); min-width: calc(60px * var(--k)); }
  .row .t { font: 600 calc(70px * var(--k))/1.1 var(--display); color: var(--text); }
  bdi { unicode-bidi: isolate; }

  /* charts (kit.js builds the inside): every number is the data's own string once it settles */
  .chart { width: 100%; max-width: calc(1000px * var(--k)); color: var(--text); font: 500 calc(32px * var(--k))/1.25 var(--body); }
  .chart + .chart { margin-top: calc(40px * var(--k)); }
  .chart[data-kind=number] { font: 700 calc(190px * var(--k))/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .chart[data-kind=bar] { display: flex; align-items: flex-end; gap: calc(28px * var(--k)); padding-top: calc(64px * var(--k)); } /* the tallest value sits above its bar */
  .chart[data-kind=bar] .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .chart[data-kind=bar] .plot { position: relative; width: 100%; height: calc(var(--chart-h, 440px) * var(--k)); display: flex; align-items: flex-end; justify-content: center; }
  .chart[data-kind=bar] .bar { width: 68%; height: 0; background: var(--accent); border-radius: calc(8px * var(--k)) calc(8px * var(--k)) 0 0; }
  .chart[data-kind=bar] .val { position: absolute; left: 0; right: 0; bottom: 0; margin-bottom: calc(12px * var(--k)); text-align: center;
    font: 700 calc(40px * var(--k))/1 var(--display); font-variant-numeric: tabular-nums; }
  .chart[data-kind=bar] .lab { margin-top: calc(14px * var(--k)); color: rgba(255,255,255,.8); text-align: center; overflow-wrap: anywhere; }
  .chart[data-kind=line] .plot { display: block; width: 100%; height: calc(var(--chart-h, 440px) * var(--k)); overflow: visible; }
  .chart[data-kind=line] .ln { fill: none; stroke: var(--accent); stroke-width: calc(7px * var(--k)); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
  .chart[data-kind=line] .dot { fill: var(--accent); }
  .chart[data-kind=line] .val { fill: var(--text); font: 700 calc(36px * var(--k)) var(--display); }
  .chart[data-kind=line] .lab { fill: rgba(255,255,255,.8); font: 500 calc(32px * var(--k)) var(--body); }
  .chart[data-kind=donut] { display: flex; align-items: center; gap: calc(40px * var(--k)); }
  .chart[data-kind=donut] .plot { width: 46%; flex: none; }
  .chart[data-kind=donut] .seg { fill: none; stroke-width: 30; }
  .chart[data-kind=donut] .legend { flex: 1; min-width: 0; display: grid; gap: calc(18px * var(--k)); }
  .chart[data-kind=donut] .legend div { display: flex; align-items: center; gap: calc(14px * var(--k)); }
  .chart[data-kind=donut] .legend i { width: calc(26px * var(--k)); height: calc(26px * var(--k)); border-radius: 50%; flex: none; }
  .chart[data-kind=donut] .legend .val { margin-inline-start: auto; font: 700 calc(40px * var(--k))/1 var(--display); }
  /* diagrams: lines draw in, nodes and labels fade in (kit.js); restyle freely per video */
  .diagram { display: block; width: 100%; overflow: visible; }
  .diagram :is(path, line, polyline) { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .diagram :is(circle, rect, ellipse) { fill: color-mix(in srgb, var(--accent) 22%, var(--ink)); stroke: var(--accent); stroke-width: 3; }
  .diagram text { fill: var(--text); font: 600 22px var(--body); }
  .chart .s0 { stroke: var(--accent); background: var(--accent); }
  .chart .s1 { stroke: color-mix(in srgb, var(--accent) 55%, var(--paper)); background: color-mix(in srgb, var(--accent) 55%, var(--paper)); }
  .chart .s2 { stroke: color-mix(in srgb, var(--accent) 45%, var(--ink)); background: color-mix(in srgb, var(--accent) 45%, var(--ink)); }
  .chart .s3 { stroke: color-mix(in srgb, var(--paper) 70%, var(--ink)); background: color-mix(in srgb, var(--paper) 70%, var(--ink)); }
  .chart .s4 { stroke: color-mix(in srgb, var(--paper) 35%, var(--ink)); background: color-mix(in srgb, var(--paper) 35%, var(--ink)); }
  [data-at] { opacity: 0; }

  /* end card: wipes in from the bottom at SPOTLIGHT.end */
  #end { position: absolute; inset: 0; background: var(--paper); clip-path: inset(100% 0 0 0);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(22px * var(--k));
    text-align: center; padding: var(--safe-top) var(--side) var(--safe-bottom); }
  #edge { position: absolute; left: 0; right: 0; height: 8px; background: var(--accent); opacity: 0; }
  .end-logo { width: calc(520px * var(--k)); max-height: 42%; object-fit: contain; margin-bottom: calc(24px * var(--k)); }
  .end-big { font: 700 calc(72px * var(--k))/1.15 var(--display); color: var(--ink); }
  .end-line { font: 600 calc(42px * var(--k))/1.3 var(--body); color: var(--ink); }
  .end-small { font: 500 calc(38px * var(--k))/1.3 var(--body); color: var(--muted); }

  /* your styles: here, after the template's, so they win */
</style>
</head>
<body>
<div id="stage">
  <img id="foot" alt="">
  <img id="panel" alt="">
  <img id="web" alt="">
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="dip"></div>
  <div id="scrim-top" class="scrim"></div>
  <div id="scrim-bottom" class="scrim"></div>

  <!-- captions: data-a/data-b = on screen from/to (s); each [data-at] lands at that time; data-scrim=top|bottom.
  <div class="cap low" data-a="6.2" data-b="10.2" data-scrim="bottom"><div class="rule"></div>
    <div class="kicker" data-at="6.25">City · Country</div>
    <div class="line"><span class="ln" data-at="6.45">First line of the brief's words</span><span class="ln" data-at="6.75">second line</span></div>
  </div>
  List card: <div class="cap mid" data-a=".." data-b=".."><div class="row" data-at=".."><span class="n">01</span><span class="t">Item</span></div>…</div>
  RTL: <div class="cap low" lang="fa" dir="rtl" …>, numbers/URLs/Latin names inside <bdi dir="ltr">…</bdi>
  3D labels (three shots): <div class="label" data-anchor="dubai" lang="en">Dubai</div>, directly in #stage -->

  <div id="end">
    <!-- <img class="end-logo" src="logo.png" alt="" data-at="18.2">
         <div class="end-big" data-at="18.5">example.com</div>
         <div class="end-line" data-at="18.65">WhatsApp <bdi dir="ltr">+000 0000 0000</bdi></div>
         <div class="end-small" data-at="18.8">hello@example.com</div> -->
  </div>
  <div id="edge"></div>
</div>
<script src="timeline.js"></script>
<script src="kit.js"></script>
</body>
</html>
